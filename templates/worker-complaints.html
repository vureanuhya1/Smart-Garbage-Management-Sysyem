<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Worker Complaints | SmartClean</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/common.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/worker-complaints.css') }}">
</head>

<body>

<header class="navbar">

    <a href="/" class="logo">

        <div class="logo-icon">♻</div>

        <div class="logo-text">
            <h2>SmartClean</h2>
            <p>Smart Garbage Management</p>
        </div>

    </a>

    <nav>
        <ul class="nav-links">
 <li><a href="/worker-profile">Profile</a>
</li>
            <li>
                <a href="/worker-dashboard">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="/worker-complaints" class="active">
                    Complaints
                </a>
            </li>

            <li>
                <a href="/worker-reports">
                    Reports
                </a>
            </li>

        </ul>
    </nav>

   <div class="worker-nav">

    <button class="profile-button" id="profileButton">
        <span class="profile-avatar">👷</span>
        <span class="profile-name">Worker</span>
    </button>

    <button
        class="logout-button"
        id="logoutButton"
        type="button">
        Logout
    </button>

</div>

</header>


<main class="complaints-page">

    <div class="complaints-glow glow-one"></div>
    <div class="complaints-glow glow-two"></div>


    <!-- PAGE HEADER -->

    <section class="complaints-header">

        <div>

            <span class="page-badge">
                WORKER PORTAL
            </span>

            <h1>
                Assigned Complaints
            </h1>

            <p>
                Review, update and manage garbage collection
                complaints assigned to you.
            </p>

        </div>


        <a href="/worker-dashboard"
           class="back-dashboard">
            ← Dashboard
        </a>

    </section>


    <!-- FILTER BAR -->

    <section class="filter-card">

        <div class="search-box">

            <span>🔍</span>

            <input
                type="text"
                id="searchComplaint"
                placeholder="Search complaints..."
            >

        </div>


        <select id="statusFilter">

            <option value="all">
                All Status
            </option>

            <option value="Assigned">
                Assigned
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Resolved">
                Resolved
            </option>

        </select>

    </section>


    <!-- COMPLAINTS -->

    <section
        id="complaintsList"
        class="complaints-list">
    </section>


</main>


<footer class="footer">

    <div>
        <strong>♻ SmartClean</strong>

        <p>
            Smart Garbage Management System
        </p>
    </div>

    <div>
        © 2026 SmartClean · Team 4
    </div>

</footer>


<script>
const complaintsList = document.getElementById("complaintsList");
const searchInput = document.getElementById("searchComplaint");
const statusFilter = document.getElementById("statusFilter");
const logoutButton = document.getElementById("logoutButton");

let complaints = [];

async function loadWorkerComplaints() {
    try {
        const response = await fetch("/api/worker/complaints", {
            credentials: "same-origin"
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Unable to load complaints.");
        }

        complaints = Array.isArray(data) ? data : [];
        renderComplaints();
    } catch (error) {
        console.error("Worker complaints error:", error);
        complaintsList.innerHTML = `
            <div class="empty-state">
                <div>⚠️</div>
                <h3>Unable to load complaints</h3>
                <p>Please refresh the page and try again.</p>
            </div>`;
    }
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function statusClass(status) {
    if (status === "Resolved") return "completed";
    if (status === "In Progress") return "progress";
    return "pending";
}

function nextStatusFor(status) {
    if (status === "Assigned") return "In Progress";
    if (status === "In Progress") return "Resolved";
    return null;
}

function renderComplaints() {
    const query = (searchInput.value || "").trim().toLowerCase();
    const selectedStatus = statusFilter.value;

    const rows = complaints.filter(complaint => {
        const searchable = [
            complaint.id,
            complaint.issue_type,
            complaint.street_number,
            complaint.description,
            complaint.citizen_name
        ].join(" ").toLowerCase();

        const matchesSearch = !query || searchable.includes(query);
        const matchesStatus =
            selectedStatus === "all" || complaint.status === selectedStatus;

        return matchesSearch && matchesStatus;
    });

    if (!rows.length) {
        complaintsList.innerHTML = `
            <div class="empty-state">
                <div>🔍</div>
                <h3>No complaints found</h3>
                <p>Try changing your search or status filter.</p>
            </div>`;
        return;
    }

    complaintsList.innerHTML = rows.map(complaint => {
        const nextStatus = nextStatusFor(complaint.status);
        const button = nextStatus
            ? `<button class="update-button" onclick="updateComplaint('${escapeHtml(complaint.id)}')">
                    Mark ${escapeHtml(nextStatus)}
               </button>`
            : `<span class="status-note">Resolved</span>`;

        return `
            <div class="complaint-card">
                <div class="complaint-icon">🗑️</div>

                <div class="complaint-info">
                    <span class="complaint-id">${escapeHtml(complaint.id)}</span>
                    <h2>${escapeHtml(complaint.issue_type)}</h2>
                    <p>📍 ${escapeHtml(complaint.street_number || "-")}</p>
                    <small>📅 Reported: ${escapeHtml(complaint.date || "-")}</small>
                </div>

                <div class="complaint-right">
                    <span class="status ${statusClass(complaint.status)}">
                        ${escapeHtml(complaint.status)}
                    </span>
                    ${button}
                </div>
            </div>`;
    }).join("");
}

async function updateComplaint(id) {
    const complaint = complaints.find(item => item.id === id);
    if (!complaint) return;

    const nextStatus = nextStatusFor(complaint.status);

    if (!nextStatus) {
        alert("This complaint is already resolved.");
        return;
    }

    const confirmed = confirm(
        `Change ${complaint.id} from ${complaint.status} to ${nextStatus}?`
    );

    if (!confirmed) return;

    try {
        const response = await fetch(
            `/api/worker/complaints/${encodeURIComponent(id)}/status`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({ status: nextStatus })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Status update failed.");
        }

        await loadWorkerComplaints();
    } catch (error) {
        console.error("Status update error:", error);
        alert(error.message || "Unable to update complaint status.");
    }
}

searchInput.addEventListener("input", renderComplaints);
statusFilter.addEventListener("change", renderComplaints);

if (logoutButton) {
    logoutButton.addEventListener("click", () => {
        if (confirm("Are you sure you want to logout?")) {
            window.location.href = "/worker-logout";
        }
    });
}

loadWorkerComplaints();
</script>

</body>
</html>
